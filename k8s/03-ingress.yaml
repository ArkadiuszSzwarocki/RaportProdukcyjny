apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: raportprodukcyjny
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - raportprodukcyjny.example.com
    secretName: app-tls-cert
  rules:
  - host: raportprodukcyjny.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: app-service
            port:
              number: 80

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-ingress-policy
  namespace: raportprodukcyjny
spec:
  podSelector:
    matchLabels:
      app: raportprodukcyjny
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8082

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-egress-policy
  namespace: raportprodukcyjny
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - raportprodukcyjny
      - raportprodukcyjny-daemons
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: mysql
    ports:
    - protocol: TCP
      port: 3306
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  # Public integrations: web/TLS, SMTP and MQTT only.
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 465
    - protocol: TCP
      port: 587
    - protocol: TCP
      port: 1883
    - protocol: TCP
      port: 8883
  # Printer bridge/raw printer traffic is LAN-only. Site overlays can narrow
  # these private ranges further to the actual printer VLAN/subnet.
  - to:
    - ipBlock:
        cidr: 10.0.0.0/8
    - ipBlock:
        cidr: 172.16.0.0/12
    - ipBlock:
        cidr: 192.168.0.0/16
    ports:
    - protocol: TCP
      port: 3001
    - protocol: TCP
      port: 9100
