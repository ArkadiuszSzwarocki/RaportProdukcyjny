apiVersion: v1
kind: Namespace
metadata:
  name: raportprodukcyjny

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: raportprodukcyjny
data:
  FLASK_ENV: "production"
  TZ: "Europe/Warsaw"
  DB_HOST: "mysql-service"
  DB_PORT: "3307"
  # Set to external DB IP if needed: e.g. "192.168.0.18"
  DB_NAME: "biblioteka"
  PORT: "8082"
  HOST: "0.0.0.0"
  WATCHDOG_URL: "http://192.168.0.57:3005/api/log"

---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: raportprodukcyjny
type: Opaque
stringData:
  SECRET_KEY: "CHANGE_THIS_TO_RANDOM_SECRET_KEY_MIN_32_CHARACTERS"
  DB_USER: "biblioteka"
  DB_PASSWORD: "CHANGE_THIS_TO_YOUR_DB_PASSWORD"
  INITIAL_ADMIN_PASSWORD: "change-me-admin"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: raportprodukcyjny
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-logs-pvc
  namespace: raportprodukcyjny
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-raporty-pvc
  namespace: raportprodukcyjny
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
