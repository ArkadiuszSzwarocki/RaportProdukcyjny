apiVersion: v1
kind: Namespace
metadata:
  name: raportprodukcyjny

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: raportprodukcyjny
data:
  FLASK_ENV: "production"
  TZ: "Europe/Warsaw"
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_NAME: "biblioteka"
  DB_SSL_DISABLED: "false"
  PORT: "8082"
  HOST: "0.0.0.0"
  SESSION_COOKIE_SECURE: "true"
  TRUST_PROXY_HEADERS: "true"
  TRUSTED_PROXY_HOPS: "1"
  ENABLE_BACKGROUND_DAEMONS: "false"
  # Optional integrations must be injected by the deployment environment.
  WATCHDOG_URL: ""

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: raportprodukcyjny
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-logs-pvc
  namespace: raportprodukcyjny
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-raporty-pvc
  namespace: raportprodukcyjny
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
