apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: raportprodukcyjny
automountServiceAccountToken: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: raportprodukcyjny
spec:
  # The shared logs/reports PVCs are ReadWriteOnce. Keep a single web replica
  # unless the deployment overlay replaces them with ReadWriteMany/object storage.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: raportprodukcyjny
  template:
    metadata:
      labels:
        app: raportprodukcyjny
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
    spec:
      serviceAccountName: app-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        # Deployment tooling MUST replace this fail-safe placeholder with the
        # exact tested image tag/digest before kubectl apply.
        image: ghcr.io/arkadiuszszwarocki/raportprodukcyjny:sha-REPLACE_WITH_TESTED_COMMIT
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
          name: http
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SECRET_KEY
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: ENCRYPTION_KEY
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PASSWORD
        - name: INITIAL_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: INITIAL_ADMIN_PASSWORD
        - name: PRINTER_BRIDGE_TOKEN
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: PRINTER_BRIDGE_TOKEN
        - name: ENABLE_BACKGROUND_DAEMONS
          value: "false"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: false
        livenessProbe:
          httpGet:
            path: /
            port: 8082
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: raporty
          mountPath: /app/raporty
      volumes:
      - name: logs
        persistentVolumeClaim:
          claimName: app-logs-pvc
      - name: raporty
        persistentVolumeClaim:
          claimName: app-raporty-pvc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-daemons
  namespace: raportprodukcyjny
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: raportprodukcyjny-daemons
  template:
    metadata:
      labels:
        app: raportprodukcyjny-daemons
    spec:
      serviceAccountName: app-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: daemons
        image: ghcr.io/arkadiuszszwarocki/raportprodukcyjny:sha-REPLACE_WITH_TESTED_COMMIT
        imagePullPolicy: IfNotPresent
        command: ["python", "scripts/run_daemons.py"]
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SECRET_KEY
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: ENCRYPTION_KEY
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PASSWORD
        - name: INITIAL_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: INITIAL_ADMIN_PASSWORD
        - name: PRINTER_BRIDGE_TOKEN
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: PRINTER_BRIDGE_TOKEN
        - name: ENABLE_BACKGROUND_DAEMONS
          value: "true"
        - name: SKIP_DB_SETUP
          value: "true"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "384Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: false
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: raporty
          mountPath: /app/raporty
      volumes:
      - name: logs
        persistentVolumeClaim:
          claimName: app-logs-pvc
      - name: raporty
        persistentVolumeClaim:
          claimName: app-raporty-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: raportprodukcyjny
spec:
  type: ClusterIP
  selector:
    app: raportprodukcyjny
  ports:
  - port: 80
    targetPort: 8082
    protocol: TCP
    name: http
