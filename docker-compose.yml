version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: raportprodukcyjny_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: ${TZ:-Europe/Warsaw}
    ports:
      # Optional host exposure for administration. Containers always use 3306.
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raportprodukcyjny_net
    restart: unless-stopped

  app:
    image: ghcr.io/arkadiuszszwarocki/raportprodukcyjny:latest
    container_name: raportprodukcyjny_app
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      TZ: ${TZ:-Europe/Warsaw}
      PORT: 8082
      HOST: 0.0.0.0
      ENABLE_BACKGROUND_DAEMONS: "false"
      TRUST_PROXY_HEADERS: "false"
      PRINTER_BRIDGE_URL: ${PRINTER_BRIDGE_URL:-http://127.0.0.1:3001}
      PRINTER_BRIDGE_TOKEN: ${PRINTER_BRIDGE_TOKEN:?PRINTER_BRIDGE_TOKEN is required}
      PRINTER_BRIDGE_AUTOSTART: ${PRINTER_BRIDGE_AUTOSTART:-false}
      USE_SSL: ${USE_SSL:?USE_SSL is required}
      TLS_CERT_FILE: /run/secrets/tls-cert.pem
      TLS_KEY_FILE: /run/secrets/tls-key.pem
    ports:
      - "${APP_HOST_PORT:-5005}:8082"
    volumes:
      - ./logs:/app/logs
      - ./raporty:/app/raporty
      - ./config:/app/config:ro
      - "${TLS_CERT_HOST_PATH:?TLS_CERT_HOST_PATH is required}:/run/secrets/tls-cert.pem:ro"
      - "${TLS_KEY_HOST_PATH:?TLS_KEY_HOST_PATH is required}:/run/secrets/tls-key.pem:ro"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - raportprodukcyjny_net
    restart: unless-stopped

volumes:
  db_data:
    driver: local

networks:
  raportprodukcyjny_net:
    driver: bridge
