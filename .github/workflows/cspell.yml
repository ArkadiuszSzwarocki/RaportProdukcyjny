name: cSpell
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  spellcheck:
    name: Spellcheck (cSpell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.18.0"
      - name: Install pinned cspell
        run: npm install -g cspell@10.3.5
      - name: Run cspell
        run: cspell --config .cspell.json "**/*"
