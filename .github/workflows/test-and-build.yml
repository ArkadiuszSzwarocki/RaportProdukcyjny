name: Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: test_db
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with pylint
        run: |
          pylint --disable=all --enable=E,F app/

      - name: Type check with mypy
        continue-on-error: true
        run: |
          mypy app/ --ignore-missing-imports

      - name: Run tests
        run: pytest -v --tb=short
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: test_db
          FLASK_ENV: testing
          SECRET_KEY: ci-test-secret-key

      - name: Coverage report
        run: |
          pytest --cov=app --cov-report=xml
          echo "Coverage report generated"
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: test_db
          FLASK_ENV: testing
          SECRET_KEY: ci-test-secret-key

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t raportprodukcyjny:${{ github.sha }} .
          docker build -t raportprodukcyjny:latest .

      - name: Test Docker image (basic)
        run: |
          docker run --rm \
            -e DB_HOST=localhost \
            -e DB_PORT=3306 \
            -e DB_USER=testuser \
            -e DB_PASSWORD=testpass \
            -e DB_NAME=test_db \
            -e FLASK_ENV=testing \
            -e SECRET_KEY=ci-test-secret \
            raportprodukcyjny:latest python -c "import sys; sys.exit(0)"

      - name: Verify Docker image built successfully
        run: docker images raportprodukcyjny --format '{{.Repository}}:{{.Tag}} {{.Size}}'
