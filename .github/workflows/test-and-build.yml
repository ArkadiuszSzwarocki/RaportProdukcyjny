name: Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with pylint
        # app.db is intentionally a lazy compatibility facade resolved through
        # module __getattr__. Platform print/PDF modules are optional by design.
        # Keep all other E/F diagnostics enabled.
        run: >-
          pylint --disable=all --enable=E,F
          --ignored-modules=app.db,playwright.sync_api,win32print,win32api,win32ui,fitz,PIL.Image,PIL.ImageWin
          app/ printer_server/

      - name: Type check with mypy
        continue-on-error: true
        run: mypy app/ --ignore-missing-imports

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        run: docker build -t raportprodukcyjny:${{ github.sha }} .

      - name: Test Docker image import
        run: |
          docker run --rm \
            -e DB_HOST=localhost \
            -e DB_PORT=3306 \
            -e DB_USER=testuser \
            -e DB_PASSWORD=testpass \
            -e DB_NAME=test_db \
            -e FLASK_ENV=testing \
            -e SECRET_KEY=ci-test-secret-key \
            -e PRINTER_BRIDGE_AUTOSTART=false \
            -e ENABLE_BACKGROUND_DAEMONS=false \
            -e SKIP_DB_SETUP=true \
            raportprodukcyjny:${{ github.sha }} \
            python -c "import wsgi; from app import app; print('[OK] wsgi and app loaded successfully')"

      - name: Verify Docker image
        run: docker images raportprodukcyjny --format '{{.Repository}}:{{.Tag}} {{.Size}}'
