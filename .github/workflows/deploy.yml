# cspell:words arkadiuszszwarocki raportprodukcyjny cyclonedx
name: Docker Build and Push

on:
  workflow_run:
    workflows: ["Test & Build", "Python tests", "cSpell"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: production-image-publication
  cancel-in-progress: false

jobs:
  scan:
    outputs:
      ready: ${{ steps.validations.outputs.ready }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Require all validations on the exact main commit
        id: validations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python scripts/check_release_validations.py "$RELEASE_SHA"

      - name: Run Trivy vulnerability scanner
        if: steps.validations.outputs.ready == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Upload Trivy results to GitHub Security tab
        if: always() && steps.validations.outputs.ready == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        continue-on-error: true
        with:
          sarif_file: "trivy-results.sarif"

  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      needs.scan.outputs.ready == 'true'
    runs-on: ubuntu-latest
    needs: scan
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tested Docker image locally
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          load: true
          push: false
          tags: |
            ghcr.io/arkadiuszszwarocki/raportprodukcyjny:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify locked packages and offline report generation
        env:
          IMAGE: ghcr.io/arkadiuszszwarocki/raportprodukcyjny:sha-${{ github.event.workflow_run.head_sha }}
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m --cap-drop ALL --security-opt no-new-privileges:true --entrypoint python "$IMAGE" scripts/verify_runtime_packages.py
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m --cap-drop ALL --security-opt no-new-privileges:true --entrypoint python "$IMAGE" scripts/smoke_runtime_image.py

      - name: Gate publication on built image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "image"
          image-ref: ghcr.io/arkadiuszszwarocki/raportprodukcyjny:sha-${{ github.event.workflow_run.head_sha }}
          format: "json"
          output: "image-vulnerabilities.json"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Generate image component inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "image"
          image-ref: ghcr.io/arkadiuszszwarocki/raportprodukcyjny:sha-${{ github.event.workflow_run.head_sha }}
          format: "cyclonedx"
          output: "image-sbom.cdx.json"
          exit-code: "0"

      - name: Publish the scanned image and record its digest
        env:
          IMAGE: ghcr.io/arkadiuszszwarocki/raportprodukcyjny:sha-${{ github.event.workflow_run.head_sha }}
        run: |
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' > image-digest.txt
          cat image-digest.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Update latest for Watchtower from the scanned image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          IMAGE: ghcr.io/arkadiuszszwarocki/raportprodukcyjny:sha-${{ github.event.workflow_run.head_sha }}
          LATEST_IMAGE: ghcr.io/arkadiuszszwarocki/raportprodukcyjny:latest
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_main" != "$RELEASE_SHA" ]; then
            echo 'A newer main commit exists; latest remains unchanged.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker tag "$IMAGE" "$LATEST_IMAGE"
          docker push "$LATEST_IMAGE"
          docker image inspect "$LATEST_IMAGE" --format '{{index .RepoDigests 0}}' > latest-image-digest.txt
          cat latest-image-digest.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve image security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-security-evidence
          path: |
            image-vulnerabilities.json
            image-sbom.cdx.json
            image-digest.txt
            latest-image-digest.txt
