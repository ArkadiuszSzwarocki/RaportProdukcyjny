name: Build and Deploy to QNAP

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for buildx)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY_HOST }} # e.g. ghcr.io or docker.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to QNAP via SSH
        if: ${{ secrets.QNAP_HOST && secrets.QNAP_USER && secrets.QNAP_SSH_PRIVATE_KEY }}
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.QNAP_HOST }}
          username: ${{ secrets.QNAP_USER }}
          key: ${{ secrets.QNAP_SSH_PRIVATE_KEY }}
          port: ${{ secrets.QNAP_SSH_PORT || '22' }}
          script: |
            set -e
            echo "Pulling image on QNAP"
            docker pull ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_REPOSITORY }}:${{ github.sha }}
            if docker ps -a --format '{{.Names}}' | grep -q "${{ secrets.QNAP_CONTAINER_NAME }}"; then
              docker rm -f ${{ secrets.QNAP_CONTAINER_NAME }} || true
            fi
              docker run -d --restart unless-stopped \
              --name ${{ secrets.QNAP_CONTAINER_NAME }} \
              -p ${{ secrets.QNAP_APP_PORT }}:8089 \
              ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_REPOSITORY }}:${{ github.sha }}

# Notes:
# - Set repository secrets in GitHub: REGISTRY_HOST, REGISTRY_USERNAME, REGISTRY_PASSWORD,
#   REGISTRY_REPOSITORY (e.g. org/repo), QNAP_HOST, QNAP_USER, QNAP_SSH_PRIVATE_KEY, QNAP_CONTAINER_NAME, QNAP_APP_PORT.
# - If QNAP needs registry auth, ensure the QNAP has credentials or extend the SSH script to `docker login` there.
# - Adjust `docker run` flags (volumes, env vars) to match your production needs.
