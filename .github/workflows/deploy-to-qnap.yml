name: Build and Deploy to QNAP

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      REG_HOST: ${{ secrets.REGISTRY_HOST }}
      REG_REPO: ${{ secrets.REGISTRY_REPOSITORY }}
      REG_USER: ${{ secrets.REGISTRY_USERNAME }}
      REG_PASS: ${{ secrets.REGISTRY_PASSWORD }}
      QNAP_HOST: ${{ secrets.QNAP_HOST }}
      QNAP_USER: ${{ secrets.QNAP_USER }}
      QNAP_SSH_PRIVATE_KEY: ${{ secrets.QNAP_SSH_PRIVATE_KEY }}
      QNAP_SSH_PORT: ${{ secrets.QNAP_SSH_PORT }}
      QNAP_CONTAINER_NAME: ${{ secrets.QNAP_CONTAINER_NAME }}
      QNAP_APP_PORT: ${{ secrets.QNAP_APP_PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for buildx)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REG_HOST }} # e.g. ghcr.io or docker.io
          username: ${{ env.REG_USER }}
          password: ${{ env.REG_PASS }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REG_HOST }}/${{ env.REG_REPO }}:${{ github.sha }}

      - name: Deploy to QNAP via SSH
        if: ${{ env.QNAP_HOST != '' && env.QNAP_USER != '' && env.QNAP_SSH_PRIVATE_KEY != '' }}
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ env.QNAP_HOST }}
          username: ${{ env.QNAP_USER }}
          key: ${{ env.QNAP_SSH_PRIVATE_KEY }}
          port: ${{ env.QNAP_SSH_PORT || '22' }}
          env:
            REG_HOST: ${{ env.REG_HOST }}
            REG_REPO: ${{ env.REG_REPO }}
            QNAP_CONTAINER_NAME: ${{ env.QNAP_CONTAINER_NAME }}
            QNAP_APP_PORT: ${{ env.QNAP_APP_PORT }}
          script: |
            set -e
            echo "Pulling image on QNAP"
            docker pull ${{ env.REG_HOST }}/${{ env.REG_REPO }}:${{ github.sha }}
            if docker ps -a --format '{{.Names}}' | grep -q "${QNAP_CONTAINER_NAME}"; then
              docker rm -f "${QNAP_CONTAINER_NAME}" || true
            fi
            docker run -d --restart unless-stopped \
              --name "${QNAP_CONTAINER_NAME}" \
              -p "${QNAP_APP_PORT}:8089" \
              ${{ env.REG_HOST }}/${{ env.REG_REPO }}:${{ github.sha }}

# Notes:
# - Set repository secrets in GitHub: REGISTRY_HOST, REGISTRY_USERNAME, REGISTRY_PASSWORD,
#   REGISTRY_REPOSITORY (e.g. org/repo), QNAP_HOST, QNAP_USER, QNAP_SSH_PRIVATE_KEY, QNAP_CONTAINER_NAME, QNAP_APP_PORT.
# - If QNAP needs registry auth, ensure the QNAP has credentials or extend the SSH script to `docker login` there.
# - Adjust `docker run` flags (volumes, env vars) to match your production needs.
