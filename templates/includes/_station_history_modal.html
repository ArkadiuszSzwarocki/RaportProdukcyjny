<!-- MODAL: Historia Stacji -->
<div id="stationHistoryModal" class="modal-premium-overlay" style="display: none; z-index: 2000;">
    <div class="modal-premium-content" style="max-width: 950px; padding: 25px; max-height: 90vh; display: flex; flex-direction: column;">
        <div class="modal-premium-header" style="border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 20px;">
            <h3 style="margin: 0; color: #0f172a; font-size: 18px; display: flex; align-items: center; gap: 10px;">
                <span class="material-icons" style="color: #d946ef;">history</span> 
                Historia Stacji i Przesunięć Magazynowych
            </h3>
            <button onclick="closeStationHistoryModal()" class="modal-premium-close">&times;</button>
        </div>
        <div class="modal-premium-body" style="flex-grow: 1; overflow-y: auto;">
            <!-- Line filter pills -->
            <div style="display: flex; gap: 8px; margin-bottom: 12px; align-items: center;">
                <span style="font-size: 12px; font-weight: 700; color: #475569; margin-right: 4px;">FILTRUJ LINIE:</span>
                <button type="button" class="btn-line-filter active" id="filterLineAll" onclick="setStationHistoryLine('ALL')">Wszystkie Magazyny</button>
                <button type="button" class="btn-line-filter" id="filterLinePsd" onclick="setStationHistoryLine('PSD')">PSD</button>
                <button type="button" class="btn-line-filter" id="filterLineAgro" onclick="setStationHistoryLine('AGRO')">AGRO</button>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
                <input type="date" id="historyFilterDataOd" class="modern-input" style="flex: 1; min-width: 120px;" placeholder="Data od">
                <input type="date" id="historyFilterDataDo" class="modern-input" style="flex: 1; min-width: 120px;" placeholder="Data do">
                <select id="historyFilterTyp" class="modern-input" style="flex: 1; min-width: 150px;" title="Typ operacji">
                    <option value="ALL" selected>Wszystkie typy</option>
                    <option value="UTWORZENIE">Utworzenie Palety</option>
                    <option value="PRZYJECIE">Przyjęcie / PW</option>
                    <option value="WYDANIE">Wydanie na prod.</option>
                    <option value="PRZESUNIECIE">Przesunięcie / Ruch</option>
                    <option value="PODZIAL">Podział palety</option>
                    <option value="ZASYP">Zasyp / Dozowanie</option>
                    <option value="DOSYPKA">Dosypka</option>
                    <option value="CZYSZCZENIE">Czyszczenie</option>
                    <option value="USUNIECIE">Usunięcie</option>
                    <option value="INWENTARYZACJA">Inwentaryzacja / Korekta</option>
                    <option value="OPAKOWANIE">Zmiana opakowania</option>
                </select>
                <input type="text" id="historyFilterSurowiec" class="modern-input" style="flex: 2; min-width: 150px;" placeholder="Nazwa surowca lub SSCC">
                <input type="text" id="historyFilterStacja" class="modern-input" style="flex: 1; min-width: 100px;" placeholder="Stacja / Regał (np. BB04, MZ07)">
                <button onclick="fetchStationHistory()" class="btn-premium" style="padding: 8px 15px;"><span class="material-icons" style="font-size:18px;">search</span>Szukaj</button>
            </div>
            <table class="modern-table small compact-mobile" style="width: 100%;">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Lokalizacja / Przesunięcie</th>
                        <th>Produkt</th>
                        <th>SSCC / Nr</th>
                        <th>Ilość [kg]</th>
                        <th>Typ</th>
                        <th>Użytkownik</th>
                    </tr>
                </thead>
                <tbody id="stationHistoryTableBody">
                    <tr><td colspan="7" style="text-align: center;">Ładowanie danych...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<style>
.btn-line-filter {
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid #cbd5e1;
    background: white;
    font-size: 12px;
    font-weight: 700;
    color: #475569;
    cursor: pointer;
    transition: all 0.15s;
}
.btn-line-filter.active {
    background: #0284c7;
    color: white;
    border-color: #0284c7;
    box-shadow: 0 2px 4px rgba(2, 132, 199, 0.25);
}
</style>

<script>
let currentStationHistoryLine = 'ALL';

function setStationHistoryLine(line) {
    currentStationHistoryLine = line;
    document.querySelectorAll('.btn-line-filter').forEach(btn => btn.classList.remove('active'));
    if (line === 'PSD') document.getElementById('filterLinePsd').classList.add('active');
    else if (line === 'AGRO') document.getElementById('filterLineAgro').classList.add('active');
    else document.getElementById('filterLineAll').classList.add('active');
    fetchStationHistory();
}

function openStationHistoryModal() {
    document.getElementById('stationHistoryModal').style.display = 'flex';
    document.getElementById('historyFilterDataOd').value = '';
    document.getElementById('historyFilterDataDo').value = '';
    fetchStationHistory();
}

function closeStationHistoryModal() {
    document.getElementById('stationHistoryModal').style.display = 'none';
}

function fetchStationHistory() {
    const tbody = document.getElementById('stationHistoryTableBody');
    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;"><span class="material-icons spinning" style="vertical-align: middle; margin-right: 8px;">sync</span>Ładowanie danych...</td></tr>';
    
    let linia = currentStationHistoryLine || 'ALL';
    const dataOd = document.getElementById('historyFilterDataOd').value;
    const dataDo = document.getElementById('historyFilterDataDo').value;
    const typOperacji = document.getElementById('historyFilterTyp')?.value || 'ALL';
    const surowiec = document.getElementById('historyFilterSurowiec').value;
    const stacja = document.getElementById('historyFilterStacja').value;
    
    let url = `/warehouse-v2/historia-stacji/data?linia=${linia}&_t=${Date.now()}`;
    if(dataOd) url += `&dataOd=${dataOd}`;
    if(dataDo) url += `&dataDo=${dataDo}`;
    if(typOperacji && typOperacji !== 'ALL') url += `&typ_operacji=${encodeURIComponent(typOperacji)}`;
    if(surowiec) url += `&surowiec=${encodeURIComponent(surowiec)}`;
    if(stacja) url += `&stacja=${encodeURIComponent(stacja)}`;

    fetch(url, { cache: 'no-store' })
        .then(res => res.json())
        .then(data => {
            if (!data.success) throw new Error(data.error || data.message || 'Wystąpił błąd podczas ładowania danych');
            if (!data.data || data.data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #64748b; padding: 25px;">Brak danych w historii stacji dla wybranych filtrów.</td></tr>';
                return;
            }
            
            let html = '';
            data.data.forEach(r => {
                let stacjaHtml = '';
                let sVal = r.stacja || '';
                if (!sVal.includes('->') && r.skad && r.dokad && r.skad !== '-' && r.dokad !== '-' && r.skad !== r.dokad) {
                    sVal = `${r.skad} -> ${r.dokad}`;
                }
                if (sVal && sVal.includes('->')) {
                    const parts = sVal.split('->').map(s => s.trim());
                    let fromStyle = 'background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0;';
                    if (parts[0].toLowerCase().includes('matka')) {
                        fromStyle = 'background: #fef3c7; color: #92400e; border: 1px solid #fde68a; font-family: monospace;';
                    } else if (parts[0].toUpperCase() === 'DOSTAWA') {
                        fromStyle = 'background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; font-weight: 800;';
                    } else if (parts[0].toUpperCase() === 'CENTRALA') {
                        fromStyle = 'background: #ede9fe; color: #6b21a8; border: 1px solid #ddd6fe; font-weight: 800;';
                    }
                    if (parts[1].toLowerCase().includes('potomna') || parts[1].toLowerCase().includes('nowa paleta')) {
                        toStyle = 'background: #ede9fe; color: #6b21a8; border: 1px solid #ddd6fe; font-family: monospace;';
                    } else if (/^(BB|MZ|ZB|KO|WZ|MIX)\d*$/i.test(parts[1])) {
                        toStyle = 'background: #fef3c7; color: #b45309; border: 1px solid #fde68a; font-weight: 800;';
                    } else if (parts[1].toUpperCase() === 'OSIP' || parts[1].toUpperCase() === 'BFOS' || /^(OS|A)\d+$/i.test(parts[1])) {
                        toStyle = 'background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; font-weight: 800;';
                    }
                    stacjaHtml = `
                        <div style="display: inline-flex; align-items: center; gap: 6px; font-weight: 700;">
                            <span style="${fromStyle} padding: 2px 7px; border-radius: 4px; font-size: 11px;" title="Skąd: ${parts[0]}">${parts[0]}</span>
                            <span class="material-icons" style="font-size: 14px; color: #0284c7;">arrow_forward</span>
                            <span style="${toStyle} padding: 2px 7px; border-radius: 4px; font-size: 11px;" title="Dokąd: ${parts[1]}">${parts[1]}</span>
                        </div>
                    `;
                } else if (sVal && sVal.toLowerCase().includes('zlecenie')) {
                    stacjaHtml = `<span style="font-weight: 700; color: #6d28d9; background: #f5f3ff; padding: 3px 8px; border-radius: 4px; font-size: 11px; border: 1px solid #ddd6fe; display: inline-block;" title="${sVal}">${sVal}</span>`;
                } else {
                    stacjaHtml = `<span style="font-weight: 700; color: #0284c7;">${sVal || '-'}</span>`;
                }

                const prodDisplay = r.nazwa && r.nazwa !== '-' ? r.nazwa : '<span style="color: #94a3b8; font-style: italic;">Nieokreślony</span>';
                const komHtml = (r.komentarz && r.komentarz !== '-') ? `<div style="font-size: 11px; color: #64748b; margin-top: 3px; max-width: 250px; line-height: 1.25;" title="${r.komentarz}">${r.komentarz}</div>` : '';

                let typeBadge = '';
                const typLower = (r.typ || '').toLowerCase();
                const tooltipText = (r.komentarz && r.komentarz !== '-' ? `${r.typ}: ${r.komentarz}` : (r.typ || ''));
                if (typLower.includes('clean') || typLower.includes('czyszcz')) {
                    typeBadge = `<span class="status-badge" style="background-color: #fee2e2; color: #b91c1c; font-weight:600;" title="${tooltipText}">Czyszczenie</span>`;
                } else if (typLower.includes('dosyp')) {
                    typeBadge = `<span class="status-badge" style="background-color: #dbeafe; color: #1d4ed8; font-weight:600;" title="${tooltipText}">Dosypka</span>`;
                } else if (typLower.includes('zasyp') || typLower.includes('bufor')) {
                    typeBadge = `<span class="status-badge" style="background-color: #fef3c7; color: #b45309; font-weight:600;" title="${tooltipText}">Zasyp</span>`;
                } else if (typLower.includes('usun')) {
                    typeBadge = `<span class="status-badge" style="background-color: #fecdd3; color: #9f1239; font-weight:600;" title="${tooltipText}">Usunięcie</span>`;
                } else if (typLower.includes('dostawa') || typLower.includes('pz')) {
                    typeBadge = `<span class="status-badge" style="background-color: #e0f2fe; color: #0369a1; font-weight:600;" title="${tooltipText}">Dostawa / PZ</span>`;
                } else if (typLower.includes('utworz')) {
                    typeBadge = `<span class="status-badge" style="background-color: #fef9c3; color: #854d0e; font-weight:600;" title="${tooltipText}">Utworzenie Palety</span>`;
                } else if (typLower.includes('przyjecie') || typLower.includes('pw')) {
                    typeBadge = `<span class="status-badge" style="background-color: #dcfce7; color: #15803d; font-weight:600;" title="${tooltipText}">Przyjęcie / PW</span>`;
                } else if (typLower.includes('podzial_odjecie') || typLower.includes('podział_odjęcie')) {
                    typeBadge = `<span class="status-badge" style="background-color: #ffedd5; color: #c2410c; font-weight:600;" title="${tooltipText}">Podział (Odcięcie)</span>`;
                } else if (typLower.includes('podzial') || typLower.includes('podział')) {
                    typeBadge = `<span class="status-badge" style="background-color: #f3e8ff; color: #6b21a8; font-weight:600;" title="${tooltipText}">Podział palety</span>`;
                } else if (typLower.includes('przesuni') || typLower.includes('transfer') || typLower.includes('relokac') || typLower.includes('ruch')) {
                    typeBadge = `<span class="status-badge" style="background-color: #ede9fe; color: #5b21b6; font-weight:600;" title="${tooltipText}">Przesunięcie</span>`;
                } else if (typLower.includes('wydanie') || typLower.includes('produkcja')) {
                    typeBadge = `<span class="status-badge" style="background-color: #e0e7ff; color: #4338ca; font-weight:600;" title="${tooltipText}">Wydanie na prod.</span>`;
                } else {
                    typeBadge = `<span class="status-badge" style="background-color: #f1f5f9; color: #334155;" title="${tooltipText}">${r.typ}</span>`;
                }

                html += `<tr>
                    <td>${r.data}</td>
                    <td>${stacjaHtml}</td>
                    <td style="font-weight: 600; color: #0f172a;">${prodDisplay}</td>
                    <td style="font-size: 11px; font-family: monospace; color: #334155; font-weight: 600;">${r.nr_palety || '-'}</td>
                    <td style="font-weight: bold; color: #16a34a;">${Number(r.ilosc || 0).toFixed(2)}</td>
                    <td>${typeBadge}${komHtml}</td>
                    <td>${r.user}</td>
                </tr>`;
            });
            tbody.innerHTML = html;
        })
        .catch(err => {
            console.error(err);
            tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: red;">Błąd ładowania danych: ${err.message}</td></tr>`;
        });
}
</script>
