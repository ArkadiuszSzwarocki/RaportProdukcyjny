<!-- Universal QR Code Scanner Modal with Camera & Native Photo Support -->
<dialog id="modalQrCamera" class="modal-premium qr-scanner-dialog">
    <div class="qr-modal-container">
        <div class="modal-header qr-modal-header">
            <h4 class="modal-title">
                <span style="display:inline-flex; align-items:center; gap:6px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    Skaner kodu QR
                </span>
            </h4>
            <button type="button" class="qr-close-btn" onclick="closeQrScannerModal()" aria-label="Zamknij">&times;</button>
        </div>
        
        <div class="modal-body qr-modal-body">
            <!-- Camera Scanner Viewport -->
            <div class="qr-scanner-viewport-wrapper">
                <div id="qr-reader" class="qr-reader-box"></div>
                <div id="qr-laser-line" class="qr-laser-line"></div>
                
                <!-- Quick Floating Camera Controls -->
                <div class="qr-floating-controls" id="qr-floating-controls">
                    <button type="button" id="qr-torch-btn" class="qr-pill-btn" onclick="window.toggleQrScannerTorch()" style="display:none;">
                        💡 Latarka
                    </button>
                    <button type="button" id="qr-switch-cam-btn" class="qr-pill-btn" onclick="window.switchQrScannerCamera()" style="display:none;">
                        🔄 Zmień aparat
                    </button>
                </div>
            </div>
            
            <!-- Error / Warning Messages -->
            <div id="qr-scanner-error" class="alert alert-danger qr-error-box" style="display:none;"></div>
            
            <!-- Fallback: Native Photo Upload / Camera App -->
            <div class="qr-native-fallback-box">
                <input 
                    type="file" 
                    id="qr-native-file-input" 
                    accept="image/*" 
                    capture="environment" 
                    style="display:none;" 
                    onchange="window.handleQrNativePhotoFile(this)"
                >
                <button type="button" class="qr-btn-native-photo" onclick="document.getElementById('qr-native-file-input').click()">
                    📸 Użyj aparatu systemowego / Zrób zdjęcie
                </button>
                <div class="qr-native-hint">Gwarantowane działanie na każdym telefonie i sieci lokalnej (HTTP)</div>
            </div>

            <!-- Scanned Result Preview -->
            <div id="qr-scan-result-container" class="qr-result-container" style="display:none;">
                <div class="text-muted small">Odczytany kod:</div>
                <div id="qr-scan-result" class="qr-scan-result-text"></div>
            </div>

            <!-- Manual Input Option -->
            <details class="qr-manual-details">
                <summary>✍️ Wpisz kod ręcznie</summary>
                <div class="qr-manual-body">
                    <input 
                        type="text" 
                        id="qr-manual-input" 
                        class="form-control text-center" 
                        placeholder="Wpisz tekst / kod..."
                        oninput="enableManualQrConfirm()"
                    >
                    <button 
                        type="button"
                        class="btn btn-outline" 
                        id="qr-manual-confirm-btn"
                        onclick="confirmManualQrInput()"
                        disabled
                    >
                        Zatwierdź wpis
                    </button>
                </div>
            </details>
        </div>
        
        <div class="modal-footer qr-modal-footer">
            <button type="button" class="btn btn-outline" onclick="closeQrScannerModal()">Anuluj</button>
            <button type="button" class="btn btn-primary" id="qr-confirm-btn" onclick="confirmQrScan()" disabled>Zatwierdź</button>
        </div>
    </div>
</dialog>

<script>
function enableManualQrConfirm() {
    const input = document.getElementById('qr-manual-input');
    const btn = document.getElementById('qr-manual-confirm-btn');
    if (btn && input) {
        btn.disabled = !input.value.trim();
    }
}

function confirmManualQrInput() {
    const input = document.getElementById('qr-manual-input');
    if (!input) return;
    const value = input.value.trim();
    if (value) {
        const resEl = document.getElementById('qr-scan-result');
        if (resEl) resEl.textContent = value;
        const resBox = document.getElementById('qr-scan-result-container');
        if (resBox) resBox.style.display = 'block';
        if (typeof confirmQrScan === 'function') {
            confirmQrScan(value);
        }
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const manualInput = document.getElementById('qr-manual-input');
    if (manualInput) {
        manualInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                confirmManualQrInput();
            }
        });
    }
});
</script>
