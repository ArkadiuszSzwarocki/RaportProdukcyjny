<!-- MODAL: Czytelna oś czasu palety -->
<div id="palletFullHistoryModal" class="modal-premium-overlay" style="display: none; z-index: 2200;">
    <div class="modal-premium-content pallet-history-modal" role="dialog" aria-modal="true" aria-labelledby="palletHistoryModalTitle">
        <div class="modal-premium-header pallet-history-header">
            <div class="pallet-history-heading">
                <div class="pallet-history-heading-icon" aria-hidden="true">
                    <span class="material-icons">history</span>
                </div>
                <div>
                    <h3 id="palletHistoryModalTitle">Historia palety</h3>
                    <div id="palletHistoryModalSubtitle" class="pallet-history-subtitle"></div>
                </div>
            </div>
            <button type="button" onclick="closePalletHistoryModal()" class="modal-premium-close" title="Zamknij" aria-label="Zamknij historię">&times;</button>
        </div>

        <div class="modal-premium-body pallet-history-body">
            <section class="pallet-history-summary" aria-label="Aktualny stan palety">
                <div class="pallet-history-summary-item">
                    <span>Aktualna lokalizacja</span>
                    <strong id="palletHistoryCurrentLocation">—</strong>
                </div>
                <div class="pallet-history-summary-item">
                    <span>Stan palety</span>
                    <strong id="palletHistoryCurrentAmount">—</strong>
                </div>
                <div class="pallet-history-summary-item">
                    <span>Liczba zdarzeń</span>
                    <strong id="palletHistoryEventCount">—</strong>
                </div>
            </section>

            <div id="palletHistoryLoading" class="pallet-history-state">
                <span class="material-icons spinning" aria-hidden="true">sync</span>
                <span>Pobieranie historii palety…</span>
            </div>
            <div id="palletHistoryEmpty" class="pallet-history-state" style="display: none;">
                <span class="material-icons" aria-hidden="true">inventory_2</span>
                <strong>Brak historii dla tej palety</strong>
                <span>Nie zarejestrowano jeszcze żadnych przesunięć ani zmian statusu.</span>
            </div>
            <div id="palletHistoryTimeline" class="pallet-history-timeline" style="display: none;"></div>
        </div>

        <div class="pallet-history-footer">
            <span>Najnowsze zdarzenia są wyświetlane na górze.</span>
            <button type="button" onclick="closePalletHistoryModal()" class="btn-modal-action btn-modal-dark">Zamknij</button>
        </div>
    </div>
</div>
