<!-- MODAL: Zmiana rodzaju opakowania (Enlarged & Responsive) -->
<div id="changePackagingModal" class="modal-premium-overlay" style="display: none; z-index: 2100;">
    <div class="modal-premium-content" style="max-width: 520px;">
        <div class="modal-premium-header">
            <h3>
                <span class="material-icons" style="color: #38bdf8; font-size: 22px;">inventory_2</span> Zmień Rodzaj Opakowania
            </h3>
            <button onclick="closeChangePackagingModal()" class="modal-premium-close">&times;</button>
        </div>
        <div class="modal-premium-body">
            <p style="font-size: 13px; color: #475569; margin-top: 0; margin-bottom: 18px; line-height: 1.5;">
                Wybierz typ opakowania palety. Wpłynie to na oznaczenia w tabeli magazynowej, raportach, etykietach oraz wygląd w wizualizacji 3D cyfrowego bliźniaka.
            </p>

            <div style="margin-bottom: 18px;">
                <label style="display: block; font-size: 12px; font-weight: 800; color: #334155; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Wybierz rodzaj opakowania:</label>
                <select id="packagingTypeSelect" class="form-control" style="width: 100%; font-size: 15px; font-weight: 700; padding: 12px 14px; border: 2px solid #cbd5e1; border-radius: 12px; color: #0f172a; outline: none; background: #ffffff;" onchange="onPackagingTypeSelectChange(this.value)">
                    <option value="Big Bag (1000kg)">🔹 Big Bag (1000kg) [FIBC / Kontener elastyczny]</option>
                    <option value="Worek (25kg)">🔸 Worek (25kg) [Standardowy worek przemysłowy]</option>
                    <option value="Worek (50kg)">📦 Worek (50kg) [Ciężki worek]</option>
                    <option value="Worek (20kg)">📦 Worek (20kg)</option>
                    <option value="Karton">📦 Karton / Opakowanie zbiorcze</option>
                    <option value="Taśma">📋 Taśma / Taśma do pakowania</option>
                    <option value="Rolka / Folia">📜 Rolka / Kalka / Folia stretch</option>
                    <option value="Wiadro">🪣 Wiadro plastikowe</option>
                    <option value="Kanister / Beczka">🛢️ Kanister / Beczka</option>
                    <option value="Inne">🏷️ Inne / Własna nazwa</option>
                </select>
            </div>

            <div id="customPackagingWrap" style="margin-bottom: 18px; display: none;">
                <label style="display: block; font-size: 12px; font-weight: 800; color: #334155; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Wpisz własną nazwę opakowania:</label>
                <input type="text" id="customPackagingInput" class="form-control" placeholder="Wpisz np. Big Bag 500kg lub Skrzyniopaleta" style="width: 100%; font-size: 14px; padding: 12px 14px; border: 2px solid #cbd5e1; border-radius: 12px; box-sizing: border-box;">
            </div>

            <div id="changePackagingError" style="color: #dc2626; font-size: 13px; margin-bottom: 14px; display: none; font-weight: 700; padding: 8px 12px; background: #fee2e2; border-radius: 8px;"></div>

            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;">
                <button type="button" onclick="closeChangePackagingModal()" class="btn-print-action preview" style="padding: 10px 18px;">Anuluj</button>
                <button type="button" onclick="submitChangePackaging()" class="btn-print-action print" style="padding: 10px 24px;">Zapisz Zmianę</button>
            </div>
        </div>
    </div>
</div>
