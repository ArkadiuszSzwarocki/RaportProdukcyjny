<!-- MODAL: Zmiana lokalizacji (Custom Prompt) -->
<div id="moveLocationModal" class="modal-premium-overlay" style="display: none; z-index: 2000;">
    <div class="modal-premium-content" style="max-width: 440px;">
        <div class="modal-premium-header">
            <h3><span class="material-icons" style="color: #38bdf8;">place</span> Przenieś paletę</h3>
            <button onclick="closeMoveLocationModal()" class="modal-premium-close">&times;</button>
        </div>
        <div class="modal-premium-body">
            <div style="margin-bottom: 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 14px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <span style="font-size: 12px; font-weight: 800; color: #475569; text-transform: uppercase;">Masa / ilość do przeniesienia</span>
                    <span style="font-size: 11px; font-weight: 700; color: #64748b;">Dostępne: <strong id="moveCurrentQtyText" style="color: #0f172a;">0.00</strong> <span id="moveCurrentQtyUnit">kg</span></span>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <input type="number" id="moveAmountInput" step="0.01" min="0.01" class="form-control" style="flex: 1; font-size: 16px; font-weight: 800; padding: 10px 12px; border: 2px solid #cbd5e1; border-radius: 10px; box-sizing: border-box;">
                    <span style="font-size: 14px; font-weight: 800; color: #64748b;">kg</span>
                </div>
                <div id="moveSplitNotice" style="display: none; margin-top: 8px; font-size: 11px; line-height: 1.4; color: #0369a1; background: #e0f2fe; border: 1px solid #bae6fd; border-radius: 8px; padding: 8px 10px; font-weight: 600;">
                    <span class="material-icons" style="font-size: 14px; vertical-align: -2px; margin-right: 4px; color: #0284c7;">call_split</span>
                    <span id="moveSplitNoticeText">Częściowe przeniesienie (podział).</span>
                </div>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 12px; font-weight: 800; color: #475569; margin-bottom: 8px; text-transform: uppercase;">Nowa lokalizacja regałowa / magazynowa</label>
                <input type="text" id="newLocationInput" class="form-control" placeholder="Wpisz np. R010101 lub MP01" list="locationSuggestions" autocomplete="off" style="width: 100%; text-transform: uppercase; font-size: 16px; font-weight: 800; padding: 12px 14px; border: 2px solid #cbd5e1; border-radius: 10px; box-sizing: border-box;">
                <datalist id="locationSuggestions"></datalist>
                <div id="moveLocationError" style="color: #dc2626; font-size: 12px; margin-top: 8px; display: none; font-weight: 700;"></div>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" onclick="closeMoveLocationModal()" class="btn-print-action preview">Anuluj</button>
                <button type="button" id="btnSubmitMove" onclick="submitMoveLocation()" class="btn-print-action print">Przenieś</button>
            </div>
        </div>
    </div>
</div>
