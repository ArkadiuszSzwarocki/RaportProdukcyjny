{% extends "layout.html" %}

{% block content %}
<div class="picking-page" style="max-width: 1100px; margin: 0 auto; padding: 20px 16px;">

    <!-- TOP HEADER -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
        <div style="display: flex; align-items: center; gap: 14px;">
            <div style="width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);">
                <span class="material-icons" style="font-size: 28px;">assignment</span>
            </div>
            <div>
                <h1 style="margin: 0; font-size: 24px; font-weight: 800; color: #0f172a; letter-spacing: -0.4px;">
                    Dyspozycje Kompletacji Magazynowej (FIFO)
                </h1>
                <p style="margin: 4px 0 0 0; font-size: 13px; color: #64748b;">
                    Pobieranie i odstawianie palet surowcowych na strefę MP01 wg ścisłej kolejki FIFO
                </p>
            </div>
        </div>        <div style="display: flex; align-items: center; gap: 10px;">
            <div style="background: #f1f5f9; padding: 4px; border-radius: 10px; display: flex; gap: 4px; border: 1px solid #cbd5e1;">
                <button type="button" id="tab-active" onclick="switchPickingTab('active')" style="background: #0284c7; color: #ffffff; border: none; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s;">
                    <span class="material-icons" style="font-size: 18px;">pending_actions</span> Aktywne (<span id="tab-active-count">0</span>)
                </button>
                <button type="button" id="tab-all" onclick="switchPickingTab('all')" style="background: transparent; color: #475569; border: none; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s;">
                    <span class="material-icons" style="font-size: 18px;">history</span> Wszystkie / Historia
                </button>
            </div>
            <button type="button" onclick="loadCurrentPickingTab()" style="background: #ffffff; color: #334155; border: 1.5px solid #cbd5e1; padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s;" onmouseover="this.style.background='#f1f5f9';" onmouseout="this.style.background='#ffffff';">
                <span class="material-icons" style="font-size: 18px;">refresh</span> Odśwież
            </button>
        </div>
    </div>

    <!-- ORDERS CONTAINER -->
    <div style="background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); margin-bottom: 24px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1.5px solid #f1f5f9; padding-bottom: 14px;">
            <h2 id="picking-section-title" style="margin: 0; font-size: 17px; font-weight: 800; color: #0f172a; display: flex; align-items: center; gap: 8px;">
                <span class="material-icons" style="color: #0284c7; font-size: 22px;">pending_actions</span>
                Aktywne dyspozycje kompletacji
            </h2>
            <span id="active-picking-count" style="background: #e0f2fe; color: #0369a1; font-size: 12px; font-weight: 800; padding: 4px 12px; border-radius: 20px;">
                0 zleceń
            </span>
        </div>

        <div id="picking-orders-list" style="display: flex; flex-direction: column; gap: 14px;">
            <div style="text-align: center; padding: 40px; color: #94a3b8; font-size: 14px;">
                <span class="material-icons" style="font-size: 40px; color: #cbd5e1; display: block; margin-bottom: 8px;">hourglass_empty</span>
                Ładowanie dyspozycji...
            </div>
        </div>
    </div>

</div>

<script>
let _pickingAutoRefreshTimer = null;
let _currentTab = 'active';

document.addEventListener('DOMContentLoaded', function() {
    loadCurrentPickingTab();

    // Auto-refresh w tle co 4 sekundy
    _pickingAutoRefreshTimer = setInterval(loadCurrentPickingTab, 4000);

    window.addEventListener('focus', loadCurrentPickingTab);
    document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') loadCurrentPickingTab();
    });
    window.addEventListener('ordersChanged', loadCurrentPickingTab);

    var initRef = "{{ initial_order_ref or '' }}";
    if (initRef && typeof PickingViewModule !== 'undefined') {
        setTimeout(function() {
            PickingViewModule.openPickingModal(initRef);
        }, 300);
    }
});

window.addEventListener('beforeunload', function() {
    if (_pickingAutoRefreshTimer) clearInterval(_pickingAutoRefreshTimer);
});

function switchPickingTab(tab) {
    _currentTab = tab;
    var btnActive = document.getElementById('tab-active');
    var btnAll = document.getElementById('tab-all');
    var title = document.getElementById('picking-section-title');

    if (tab === 'active') {
        if (btnActive) {
            btnActive.style.background = '#0284c7';
            btnActive.style.color = '#ffffff';
        }
        if (btnAll) {
            btnAll.style.background = 'transparent';
            btnAll.style.color = '#475569';
        }
        if (title) {
            title.innerHTML = '<span class="material-icons" style="color: #0284c7; font-size: 22px;">pending_actions</span> Aktywne dyspozycje kompletacji';
        }
    } else {
        if (btnActive) {
            btnActive.style.background = 'transparent';
            btnActive.style.color = '#475569';
        }
        if (btnAll) {
            btnAll.style.background = '#0284c7';
            btnAll.style.color = '#ffffff';
        }
        if (title) {
            title.innerHTML = '<span class="material-icons" style="color: #0284c7; font-size: 22px;">history</span> Historia wszystkich dyspozycji';
        }
    }
    loadCurrentPickingTab();
}

function loadCurrentPickingTab() {
    if (_currentTab === 'all') {
        loadAllPickingOrders();
    } else {
        loadActivePickingOrders();
    }
}

function cancelPickingOrder(orderRef, btnElement) {
    if (!confirm('Czy na pewno chcesz ANULOWAĆ dyspozycję kompletacji ' + orderRef + '?\nWszystkie oczekujące palety zostaną zwolnione.')) {
        return;
    }

    if (btnElement) btnElement.disabled = true;

    fetch('/warehouse-v2/api/orders/picking/cancel', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ order_ref: orderRef })
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
        if (data && data.success) {
            if (typeof showToast === 'function') {
                showToast(data.message || 'Dyspozycja anulowana.', 'info');
            } else {
                alert(data.message || 'Dyspozycja anulowana.');
            }
            loadCurrentPickingTab();
            window.dispatchEvent(new CustomEvent('ordersChanged'));
            if (typeof window.refreshSidebarBadges === 'function') {
                window.refreshSidebarBadges();
            }
        } else {
            alert(data ? data.message : 'Błąd anulowania dyspozycji.');
            if (btnElement) btnElement.disabled = false;
        }
    })
    .catch(function(err) {
        console.error('Błąd anulowania dyspozycji:', err);
        alert('Błąd połączenia z serwerem.');
        if (btnElement) btnElement.disabled = false;
    });
}

function deletePickingOrder(orderRef, btnElement) {
    if (!confirm('Czy na pewno chcesz TRWALE USUNĄĆ całą dyspozycję kompletacji ' + orderRef + '?\nOperacji nie można cofnąć.')) {
        return;
    }

    if (btnElement) btnElement.disabled = true;

    fetch('/warehouse-v2/api/orders/picking/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ order_ref: orderRef })
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
        if (data && data.success) {
            if (typeof showToast === 'function') {
                showToast(data.message || 'Dyspozycja usunięta.', 'success');
            } else {
                alert(data.message || 'Dyspozycja usunięta.');
            }
            loadCurrentPickingTab();
            window.dispatchEvent(new CustomEvent('ordersChanged'));
            if (typeof window.refreshSidebarBadges === 'function') {
                window.refreshSidebarBadges();
            }
        } else {
            alert(data ? data.message : 'Błąd usuwania dyspozycji.');
            if (btnElement) btnElement.disabled = false;
        }
    })
    .catch(function(err) {
        console.error('Błąd usuwania dyspozycji:', err);
        alert('Błąd połączenia z serwerem.');
        if (btnElement) btnElement.disabled = false;
    });
}

function renderOrdersList(orders, isActiveView) {
    var container = document.getElementById('picking-orders-list');
    var badge = document.getElementById('active-picking-count');
    if (!container) return;

    if (badge) badge.textContent = orders.length + (isActiveView ? ' aktywnych' : ' łącznie');

    if (orders.length === 0) {
        container.innerHTML = `
            <div style="text-align: center; padding: 48px 20px; color: #64748b;">
                <span class="material-icons" style="font-size: 48px; color: #94a3b8; display: block; margin-bottom: 12px;">task_alt</span>
                <div style="font-size: 16px; font-weight: 700; color: #1e293b; margin-bottom: 4px;">
                    ${isActiveView ? 'Wszystkie dyspozycje są zrealizowane' : 'Brak dyspozycji w historii'}
                </div>
                <p style="font-size: 13px; color: #64748b; margin: 0;">Nowe dyspozycje pojawią się po kliknięciu „Utwórz Dyspozycję Kompletacji” w kalkulatorze zamówień.</p>
            </div>
        `;
        return;
    }

    var html = '';
    orders.forEach(function(o) {
        var total = o.total_items || 0;
        var completed = o.completed_items || 0;
        var pending = o.pending_items || 0;
        var cancelled = o.cancelled_items || 0;
        var pct = total > 0 ? Math.round((completed / total) * 100) : 0;
        var createdStr = o.created_at || '—';

        var statusBadge = '';
        if (cancelled > 0 && pending === 0 && completed === 0) {
            statusBadge = '<span style="background: #fee2e2; color: #b91c1c; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px;">ANULOWANA</span>';
        } else if (completed === total && total > 0) {
            statusBadge = '<span style="background: #dcfce7; color: #15803d; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px;">SKOMPLETOWANA</span>';
        } else if (pending > 0) {
            statusBadge = '<span style="background: #fef3c7; color: #b45309; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px;">W TOKU</span>';
        }

        var cancelBtnHtml = '';
        if (pending > 0) {
            cancelBtnHtml = `
                <button type="button" onclick="cancelPickingOrder('${o.order_ref}', this)" style="background: #fff7ed; color: #ea580c; border: 1.5px solid #fed7aa; padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s;" onmouseover="this.style.background='#ea580c'; this.style.color='#ffffff';" onmouseout="this.style.background='#fff7ed'; this.style.color='#ea580c';" title="Anuluj oczekujące pozycje">
                    <span class="material-icons" style="font-size: 18px;">cancel</span>
                    Anuluj
                </button>
            `;
        }

        var deleteBtnHtml = `
            <button type="button" onclick="deletePickingOrder('${o.order_ref}', this)" style="background: #fee2e2; color: #ef4444; border: 1.5px solid #fca5a5; padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s;" onmouseover="this.style.background='#ef4444'; this.style.color='#ffffff';" onmouseout="this.style.background='#fee2e2'; this.style.color='#ef4444';" title="Usuń dyspozycję">
                <span class="material-icons" style="font-size: 18px;">delete</span>
                Usuń
            </button>
        `;

        html += `
            <div style="background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; transition: all 0.2s;" onmouseover="this.style.borderColor='#94a3b8';" onmouseout="this.style.borderColor='#e2e8f0';">
                <div style="flex: 1; min-width: 260px;">
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap;">
                        <span style="font-family: monospace; font-size: 15px; font-weight: 800; color: #0369a1; background: #e0f2fe; padding: 4px 10px; border-radius: 6px;">
                            ${o.order_ref}
                        </span>
                        ${statusBadge}
                        <span style="font-size: 13px; font-weight: 600; color: #475569;">
                            👤 ${o.operator_login || 'Operator'}
                        </span>
                        <span style="font-size: 12px; color: #94a3b8;">
                            🕒 ${createdStr}
                        </span>
                    </div>

                    <div style="display: flex; align-items: center; gap: 12px; margin-top: 10px;">
                        <div style="flex: 1; max-width: 320px; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden;">
                            <div style="width: ${pct}%; height: 100%; background: ${pct === 100 ? '#10b981' : 'linear-gradient(90deg, #f59e0b, #0284c7)'}; border-radius: 4px; transition: width 0.4s ease;"></div>
                        </div>
                        <span style="font-size: 13px; font-weight: 700; color: #334155;">
                            ${completed} / ${total} palet (${pct}%)
                        </span>
                    </div>
                </div>

                <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                    <button type="button" onclick="PickingViewModule.openPickingModal('${o.order_ref}')" style="background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: #ffffff; border: none; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); transition: all 0.2s;" onmouseover="this.style.transform='translateY(-1px)';" onmouseout="this.style.transform='none';">
                        <span class="material-icons" style="font-size: 18px;">qr_code_scanner</span>
                        Otwórz & Skanuj
                    </button>
                    ${cancelBtnHtml}
                    ${deleteBtnHtml}
                </div>
            </div>
        `;
    });

    container.innerHTML = html;
}

function loadActivePickingOrders() {
    fetch('/warehouse-v2/api/orders/picking/active')
        .then(function(res) { return res.json(); })
        .then(function(data) {
            var orders = (data && data.success) ? (data.data || data.orders || []) : [];
            var countEl = document.getElementById('tab-active-count');
            if (countEl) countEl.textContent = orders.length;

            if (_currentTab === 'active') {
                renderOrdersList(orders, true);
            }
        })
        .catch(function(err) {
            console.error('Błąd ładowania aktywnych zleceń:', err);
        });
}

function loadAllPickingOrders() {
    fetch('/warehouse-v2/api/orders/picking/all')
        .then(function(res) { return res.json(); })
        .then(function(data) {
            var orders = (data && data.success) ? (data.data || data.orders || []) : [];
            if (_currentTab === 'all') {
                renderOrdersList(orders, false);
            }
        })
        .catch(function(err) {
            console.error('Błąd ładowania historii zleceń:', err);
        });
}
</script>
{% endblock %}
