<style>
    .warehouse-btn-base {
        height: 44px;
        min-height: 44px;
        padding: 0 14px;
        background: #f8fafc;
        border: 1px solid #cbd5e1;
        color: #475569;
        border-radius: 12px;
        font-weight: 700;
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        cursor: pointer;
        flex-shrink: 0;
        box-sizing: border-box;
        transition: all 0.2s ease;
        user-select: none;
    }
    .warehouse-btn-base:hover {
        background: #f1f5f9;
        color: #1e293b;
        border-color: #94a3b8;
    }
    .warehouse-btn-blocked {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        color: #64748b;
    }
    .warehouse-btn-blocked:hover {
        background: #fff1f2;
        border-color: #fca5a5;
        color: #b91c1c;
    }
    .warehouse-btn-blocked.active {
        background: #fee2e2 !important;
        border-color: #ef4444 !important;
        color: #991b1b !important;
        box-shadow: 0 2px 6px rgba(239, 68, 68, 0.25);
    }
    .warehouse-btn-blocked .blocked-count-badge {
        background: #ef4444;
        color: #ffffff;
        font-size: 11px;
        font-weight: 800;
        padding: 1px 6px;
        border-radius: 9999px;
        min-width: 18px;
        text-align: center;
        display: inline-block;
        transition: all 0.2s ease;
    }
    .warehouse-btn-blocked.active .blocked-count-badge {
        background: #991b1b;
        color: #ffffff;
    }
    .warehouse-print-btn {
        height: 44px;
        min-height: 44px;
        padding: 0 16px;
        background: #f8fafc;
        border: 1px solid #cbd5e1;
        color: #475569;
        border-radius: 12px;
        font-weight: 700;
        font-size: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        flex-shrink: 0;
        box-sizing: border-box;
        transition: all 0.2s ease;
    }
    .warehouse-print-btn:hover {
        background: #f1f5f9;
        color: #1e293b;
        border-color: #94a3b8;
    }
    @media (max-width: 1280px) {
        .warehouse-btn-blocked .filter-btn-text {
            display: none !important;
        }
        .warehouse-btn-blocked {
            padding: 0 10px !important;
        }
        .warehouse-print-btn {
            width: 44px;
            min-width: 44px;
            padding: 0 !important;
        }
        .warehouse-print-btn .print-btn-text {
            display: none !important;
        }
    }
    @media (max-width: 992px) {
        .warehouse-filter-row {
            flex-wrap: wrap !important;
            gap: 8px !important;
        }
        .warehouse-search-wrapper {
            order: 1 !important;
            flex: 1 1 100% !important;
            width: 100% !important;
            min-width: 100% !important;
        }
        #viewToggleBtn {
            order: 2 !important;
        }
        .warehouse-3d-btn {
            order: 3 !important;
        }
        #blockedDropdownContainer {
            order: 4 !important;
            flex: 1 1 calc(50% - 60px) !important;
            min-width: 120px !important;
        }
        #locationDropdownContainer {
            order: 5 !important;
            flex: 1 1 calc(50% - 60px) !important;
            min-width: 130px !important;
        }
        .warehouse-print-btn {
            order: 6 !important;
        }
    }
    @media (max-width: 576px) {
        #blockedDropdownContainer {
            flex: 1 1 calc(50% - 4px) !important;
            min-width: 0 !important;
            order: 2 !important;
        }
        #locationDropdownContainer {
            flex: 1 1 calc(50% - 4px) !important;
            min-width: 0 !important;
            order: 3 !important;
        }
        #viewToggleBtn {
            order: 4 !important;
        }
        .warehouse-3d-btn {
            order: 5 !important;
        }
        .warehouse-print-btn {
            order: 6 !important;
            flex: 1 1 auto !important;
            width: auto !important;
        }
        .warehouse-print-btn .print-btn-text {
            display: inline !important;
            font-size: 12px !important;
        }
    }
</style>

<div class="warehouse-filter-row" style="display: flex; align-items: center; gap: 8px; width: 100%; margin-bottom: 15px;">
    
    <!-- PRZEŁĄCZNIK WIDOKU (Po lewej, przed wyszukiwaniem) -->
    <button onclick="toggleViewMode()" id="viewToggleBtn" title="Zmień widok (Kafelki / Lista)"
            style="padding: 10px; background: white; border: 1px solid #dbe3ea; color: #64748b; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; min-width: 44px; width: 44px; min-height: 44px; height: 44px; box-sizing: border-box; flex-shrink: 0; margin: 0;">
        <span class="material-icons" id="viewToggleIcon">view_module</span>
    </button>

    <!-- WIDOK 3D REGAŁÓW -->
    <a href="{{ url_for('warehouse_v2.racks_3d_view', linia=linia) }}" class="warehouse-3d-btn" title="Widok 3D Regałów Magazynowych"
       style="padding: 10px; background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); border: 1px solid #0284c7; color: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; min-width: 44px; width: 44px; min-height: 44px; height: 44px; box-sizing: border-box; flex-shrink: 0; margin: 0; text-decoration: none; box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.3);">
        <span class="material-icons" style="font-size: 20px;">view_in_ar</span>
    </a>

    <!-- FILTR: DYNAMICZNA LISTA BLOKAD (Pogłębiona filtracja po powodach) -->
    <div style="position: relative; flex: 1; min-width: 175px;" id="blockedDropdownContainer">
        <button id="blockedDropdownBtn" onclick="toggleBlockedDropdown()" 
                class="warehouse-btn-base warehouse-btn-blocked" 
                style="width: 100%; justify-content: space-between; padding: 0 12px;"
                title="Filtruj: Wybierz powody zablokowania" aria-haspopup="true">
            <span style="display: flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                <span class="material-icons" style="font-size: 18px; color: inherit;">lock</span>
                <span id="blockedDropdownLabel">Zablokowane</span>
            </span>
            <span style="display: flex; align-items: center; gap: 4px; flex-shrink: 0;">
                <span id="headerBlockedCountBadge" class="blocked-count-badge" style="display: none;">0</span>
                <span class="material-icons" style="font-size: 18px;">expand_more</span>
            </span>
        </button>

        <div id="blockedDropdownMenu" style="display: none; position: absolute; top: 100%; left: 0; right: 0; min-width: 300px; margin-top: 8px; background: white; border: 1px solid #dbe3ea; border-radius: 14px; box-shadow: 0 12px 28px -4px rgba(0,0,0,0.14), 0 4px 8px -2px rgba(0,0,0,0.06); z-index: 100; max-height: min(75vh, 580px); overflow-y: auto; padding: 10px; scrollbar-width: thin;">
            <div style="padding: 6px 4px 10px 4px; border-bottom: 1px solid #f1f5f9; display: flex; gap: 8px;">
                <button onclick="selectAllBlockedReasons(true)" style="flex: 1; padding: 7px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; color: #1e293b;">Zaznacz wszystkie</button>
                <button onclick="selectAllBlockedReasons(false)" style="flex: 1; padding: 7px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; color: #64748b;">Wyłącz filtr</button>
            </div>
            <div id="blockedReasonCheckboxes" style="padding-top: 8px; display: flex; flex-direction: column; gap: 4px;">
                <!-- Wypełniane dynamicznie przez JS -->
            </div>
        </div>
    </div>

    <!-- WYSZUKIWARKA PRODUKTU -->
    <div class="warehouse-search-wrapper" style="position: relative; flex: 2; min-width: 160px;">
        <span class="material-icons" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 20px;">search</span>
        <input type="text" id="searchInput" placeholder="Szukaj palety..." 
               style="width: 100%; height: 44px; padding: 0 40px 0 44px; border: 1px solid #dbe3ea; border-radius: 12px; font-size: 14px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); box-sizing: border-box; background: white;">
        <span class="material-icons" id="clearSearchBtn" onclick="document.getElementById('searchInput').value=''; document.getElementById('searchInput').dispatchEvent(new Event('input')); this.style.display='none';" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 20px; cursor: pointer; display: none;">close</span>
    </div>
    
    <!-- WYSZUKIWARKA LOKALIZACJI (Multiselect) -->
    <div style="position: relative; flex: 1; min-width: 200px;" id="locationDropdownContainer">
        <button id="locationDropdownBtn" onclick="toggleLocationDropdown()" style="width: 100%; height: 44px; padding: 0 14px; border: 1px solid #dbe3ea; border-radius: 12px; font-size: 14px; background: white; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #64748b; box-sizing: border-box;">
            <span style="display: flex; align-items: center; gap: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                <span class="material-icons" style="font-size: 20px;">place</span>
                <span id="locationDropdownLabel">Filtruj Lokacje</span>
            </span>
            <span class="material-icons" style="font-size: 20px; flex-shrink: 0;">expand_more</span>
        </button>
        
        <div id="locationDropdownMenu" style="display: none; position: absolute; top: 100%; left: 0; right: 0; min-width: 280px; margin-top: 8px; background: white; border: 1px solid #dbe3ea; border-radius: 14px; box-shadow: 0 12px 28px -4px rgba(0,0,0,0.14), 0 4px 8px -2px rgba(0,0,0,0.06); z-index: 100; max-height: min(75vh, 580px); overflow-y: auto; padding: 10px; scrollbar-width: thin;">
            <div style="padding: 6px 4px 10px 4px; border-bottom: 1px solid #f1f5f9; display: flex; gap: 10px;">
                <button onclick="selectAllLocations(true)" style="flex: 1; padding: 7px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; color: #1e293b;">Wszystkie</button>
                <button onclick="selectAllLocations(false)" style="flex: 1; padding: 7px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; color: #64748b;">Żadne</button>
            </div>
            <div id="locationCheckboxes" style="padding-top: 8px; display: flex; flex-direction: column; gap: 4px;">
                <!-- Wypełniane przez JS -->
            </div>
        </div>
    </div>
    
    <!-- PRZYCISK DRUKUJ -->
    <button onclick="printFilteredPallets()" class="warehouse-print-btn" title="Wydrukuj Listę Palet" aria-label="Wydrukuj Listę Palet">
        <span class="material-icons" style="font-size: 20px;">print</span>
        <span class="print-btn-text">Wydrukuj Listę</span>
    </button>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearSearchBtn');
            
            const toggleClearBtn = () => {
                if (searchInput.value.length > 0) clearBtn.style.display = 'block';
                else clearBtn.style.display = 'none';
            };

            searchInput.addEventListener('input', toggleClearBtn);
            setTimeout(toggleClearBtn, 500);
        });

        // Obsługa kliknięć poza dropdownami
        document.addEventListener('click', function(e) {
            const locContainer = document.getElementById('locationDropdownContainer');
            if (locContainer && !locContainer.contains(e.target)) {
                const locMenu = document.getElementById('locationDropdownMenu');
                if (locMenu) locMenu.style.display = 'none';
            }

            const blkContainer = document.getElementById('blockedDropdownContainer');
            if (blkContainer && !blkContainer.contains(e.target)) {
                const blkMenu = document.getElementById('blockedDropdownMenu');
                if (blkMenu) blkMenu.style.display = 'none';
            }
        });
        
        function toggleLocationDropdown() {
            const menu = document.getElementById('locationDropdownMenu');
            if (!menu) return;
            const isHidden = (menu.style.display === 'none' || menu.style.display === '');
            const blkMenu = document.getElementById('blockedDropdownMenu');
            if (blkMenu) blkMenu.style.display = 'none';
            menu.style.display = isHidden ? 'block' : 'none';
        }
    </script>
</div>
