<div class="modal-overlay scn-overlay-dark" id="scannerRestoreOverlay">
  <div class="scn-light-dialog">
    <div class="scn-light-header">
      <h3 class="scn-light-title">
        <span class="material-icons scn-icon-blue-24">restore</span> Przywracanie Palety
      </h3>
      <button type="button" class="scn-light-close" onclick="closeScannerRestoreModal()">&times;</button>
    </div>

    <div class="scn-light-info-card">
      <div class="scn-light-info-tag">Materiał</div>
      <div id="restoreModalPalletName" class="scn-light-info-name">-</div>
      <div class="scn-light-info-meta">
        <span>SSCC: <strong id="restoreModalSSCC" class="scn-mono scn-text-dark">-</strong></span>
        <span>Partia: <strong id="restoreModalBatch" class="scn-text-dark">-</strong></span>
      </div>
    </div>

    <div class="scn-field-block">
      <label class="scn-light-label" for="restoreModalWeight">Waga przywracana (kg):</label>
      <input type="number" id="restoreModalWeight" step="0.1" min="0" class="form-control scn-light-input">
    </div>

    <div class="scn-field-block">
      <label class="scn-light-label" for="restoreModalLocation">Lokalizacja docelowa (np. MP01, R030101):</label>
      <div class="scn-input-wrap">
        <input type="text" id="restoreModalLocation" class="form-control scn-light-input scn-light-input--upper">
        <button type="button" onclick="clearScannerInputById('restoreModalLocation')" title="Wyczyść pole"
          class="input-clear-btn scn-clear-btn">
          <span class="material-icons scn-clear-icon">close</span>
        </button>
      </div>
    </div>

    <div class="scn-light-actions">
      <button type="button" class="btn btn-outline scn-light-btn-cancel" onclick="closeScannerRestoreModal()">
        Anuluj
      </button>
      <button type="button" id="btnConfirmScannerRestore" class="scn-light-btn-primary" onclick="confirmScannerRestore()">
        <span class="material-icons scn-icon-18">check</span> Przywróć na stan
      </button>
    </div>
  </div>
</div>
