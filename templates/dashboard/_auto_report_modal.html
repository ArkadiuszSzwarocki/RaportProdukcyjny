<!-- Modal: Wstrzymanie / Zmiana czasu Auto-Raportu -->
<div id="autoReportScheduleModal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px); z-index: 99999; align-items: center; justify-content: center;">
  <div class="modal-card" style="background: #ffffff; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); overflow: hidden; border: 1px solid #e2e8f0; animation: modalPop 0.2s ease-out;">
    
    <!-- Modal Header -->
    <div style="padding: 16px 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
      <div style="font-weight: 800; color: #0f172a; font-size: 1rem; display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 20px;">⏰</span> Harmonogram Auto-Raportu (15:00)
      </div>
      <button type="button" onclick="window.closeAutoReportScheduleModal()" style="background: none; border: none; font-size: 20px; color: #64748b; cursor: pointer; padding: 0 4px; line-height: 1;">&times;</button>
    </div>

    <!-- Modal Body -->
    <div style="padding: 20px;">
      <div id="autoReportCurrentStatus" style="margin-bottom: 16px; padding: 12px 14px; background: #eff6ff; border: 1.5px solid #bfdbfe; border-radius: 10px; font-size: 0.9rem; color: #1e40af;">
        📅 Zaplanowany czas wysyłki: <strong id="autoReportCurrentTime">15:00</strong>
        <div id="autoReportSubNote" style="font-size: 0.78rem; color: #3b82f6; margin-top: 2px;">Raport I zmiany wysyła się automatycznie do zdefiniowanych odbiorców.</div>
      </div>

      <div style="font-weight: 700; color: #475569; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px;">
        ⚡ Szybkie odroczenie wysyłki (będziesz pracować dłużej):
      </div>

      <!-- Quick Add Buttons -->
      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px;">
        <button type="button" onclick="window.submitPostponeReport({add_minutes: 15})" class="btn-action" style="padding: 10px; background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 10px; font-weight: 700; font-size: 0.88rem; color: #1e293b; cursor: pointer;">
          ⏱️ +15 min <span style="font-size: 0.75rem; color: #64748b;">(15:15)</span>
        </button>
        <button type="button" onclick="window.submitPostponeReport({add_minutes: 30})" class="btn-action" style="padding: 10px; background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 10px; font-weight: 700; font-size: 0.88rem; color: #1e293b; cursor: pointer;">
          ⏱️ +30 min <span style="font-size: 0.75rem; color: #64748b;">(15:30)</span>
        </button>
        <button type="button" onclick="window.submitPostponeReport({add_minutes: 45})" class="btn-action" style="padding: 10px; background: #eff6ff; border: 1.5px solid #3b82f6; border-radius: 10px; font-weight: 800; font-size: 0.88rem; color: #1d4ed8; cursor: pointer;">
          ⏱️ +45 min <span style="font-size: 0.75rem; color: #2563eb;">(15:45)</span>
        </button>
        <button type="button" onclick="window.submitPostponeReport({add_minutes: 60})" class="btn-action" style="padding: 10px; background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 10px; font-weight: 700; font-size: 0.88rem; color: #1e293b; cursor: pointer;">
          ⏱️ +60 min <span style="font-size: 0.75rem; color: #64748b;">(16:00)</span>
        </button>
      </div>

      <!-- Custom Time Selection -->
      <div style="margin-bottom: 16px;">
        <label for="autoReportCustomTime" style="display: block; font-weight: 700; color: #475569; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px;">
          🕒 Lub ustaw dokładną godzinę:
        </label>
        <div style="display: flex; gap: 8px;">
          <input type="time" id="autoReportCustomTime" value="15:45" style="flex: 1; padding: 8px 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-weight: 700; font-size: 0.95rem; font-family: inherit;">
          <button type="button" onclick="window.submitCustomTimeReport()" class="btn-action btn-blue" style="padding: 8px 16px; font-weight: 700; border-radius: 10px;">
            Zapisz
          </button>
        </div>
      </div>

      <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 16px 0;">

      <!-- Pause / Reset Actions -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button type="button" onclick="window.submitPostponeReport({pause_completely: true})" class="btn-action" style="padding: 9px 14px; background: #fff1f2; border: 1.5px solid #fecdd3; border-radius: 10px; font-weight: 700; font-size: 0.85rem; color: #be123c; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 8px;">
          <span>🛑</span> Wstrzymaj automat (wyślę raport ręcznie po skończonej pracy)
        </button>
        <button type="button" onclick="window.submitPostponeReport({reset_to_default: true})" class="btn-action" style="padding: 9px 14px; background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 10px; font-weight: 700; font-size: 0.85rem; color: #475569; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 8px;">
          <span>🔄</span> Przywróć domyślną godzinę 15:00
        </button>
      </div>
    </div>
  </div>
</div>
