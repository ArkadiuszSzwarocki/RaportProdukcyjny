{% if sekcja in ['Zasyp','Workowanie'] %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/cleaning-notifications.css') }}?v={{ static_version }}">
<div id="cleaningNotifications" class="cleaning-notifications">
    <button type="button" id="cleaningNotificationsBtn" aria-expanded="false" aria-controls="cleaningNotificationsPanel" onclick="window.dashboardPopover.toggle('cleaningNotificationsPanel', 'cleaningNotificationsBtn', null, event)" aria-label="Powiadomienia o czyszczeniu" title="Czyszczenie magnesów i separatorów">
        <span class="material-icons">notifications</span><span id="cleaningNotificationCount">0</span>
    </button>
    <div id="cleaningNotificationsPanel" class="cleaning-notifications-panel" style="display:none;" aria-label="Zaległe czyszczenia">
        <strong>Czyszczenie — zadania do potwierdzenia</strong>
        <div id="magnet-cleaning-alert-container"></div>
        <div id="separator-cleaning-alert-container"></div>
    </div>
</div>
{% endif %}
