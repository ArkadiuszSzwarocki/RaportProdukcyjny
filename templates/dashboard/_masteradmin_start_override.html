{% if role_lc == 'masteradmin' and not is_readonly and sekcja in ['Zasyp', 'Workowanie'] and p[3] in ['zaplanowane', 'zawieszone', 'wstrzymane'] and unfinished_section_orders|default([]) %}
<form action="{{ url_for('production.start_zlecenie', id=p[0]) }}" method="POST" style="display:inline;"
      data-start-confirm="Pominąć blokadę dla tego zlecenia? Inne działające zlecenia pozostaną w toku."
      data-start-checklist="{{ 1 if sekcja == 'Workowanie' and linia == 'AGRO' and p[3] == 'zaplanowane' else 0 }}"
      data-typ-produkcji="{{ (p[9] if p|length > 9 and p[9] else '')|e }}"
      data-required-opakowanie="{{ (p[20] if p|length > 20 and p[20] else '')|e }}"
      data-required-etykieta="{{ (p[21] if p|length > 21 and p[21] else '')|e }}"
      data-typ-opakowania="{{ (p[14] if p|length > 14 and p[14] else '')|e }}"
      onsubmit="return confirmStartOrder(this, {{ p[1]|tojson|forceescape }}, '{{ p[0] }}')">
    <input type="hidden" name="sekcja" value="{{ sekcja }}">
    <input type="hidden" name="linia" value="{{ linia }}">
    <input type="hidden" name="override_start_rule" value="1">
    <button type="submit" class="btn-action" style="background:#b45309;color:white;padding:6px 10px;border-radius:6px;" title="MasterAdmin: uruchom z pominięciem blokady jednego aktywnego zlecenia">Pomiń blokadę i {{ 'uruchom' if p[3] == 'zaplanowane' else 'wznów' }}</button>
</form>
{% endif %}
