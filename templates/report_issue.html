{% extends 'layout.html' %}

{% block content %}
<div class="page-header">
    <h1>⚠️ {{ _('zgloszenie_problem') }}</h1>
</div>

<div class="section-box p-20">
    <form id="reportForm" class="d-flex flex-column gap-15 max-width-700" enctype="multipart/form-data">
        <label for="sekcja">{{ _('sekcja_label') }}</label>
        <select id="sekcja" name="sekcja" required class="input-sm">
            <option value="Zasyp">{{ _('zasyp') }}</option>
            <option value="Workowanie">{{ _('workowanie') }}</option>
            <option value="Magazyn">{{ _('magazyn') }}</option>
            <option value="Inne">Inne</option>
        </select>

        <label for="kategoria">{{ _('typ_zdarzenia') }}</label>
        <select id="kategoria" name="kategoria" required class="input-sm">
            <option value="">-- Wybierz --</option>
            <option value="Przezbrojenie">{{ _('przezbrojenie') }}</option>
            <option value="Awaria">{{ _('awaria_maszyny') }}</option>
            <option value="Brak Surowca">{{ _('brak_surowca') }}</option>
            <option value="Przerwa">{{ _('przerwa') }}</option>
            <option value="Inne">Inne</option>
        </select>

        <div class="d-flex justify-content-between align-items-center mb-5 flex-wrap gap-10">
            <label for="opis" class="mb-0">Opis problemu (wymagany):</label>
            <button type="button" id="bugPageVoiceBtn" onclick="togglePageVoiceDictation()" style="background:#eff6ff;border:1px solid #93c5fd;color:#1d4ed8;padding:5px 12px;border-radius:8px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:all 0.2s;" title="Kliknij, aby dyktować opis problemu głosem">
                <span class="material-icons" style="font-size:18px;">mic</span>
                <span id="bugPageVoiceBtnText">Dyktuj głosem</span>
            </button>
        </div>
        <div id="bugPageVoiceStatusMsg" style="display:none;margin-bottom:6px;font-size:12px;font-weight:700;color:#dc2626;background:#fef2f2;border:1px solid #fecaca;padding:8px 12px;border-radius:8px;">
            🎙️ Słucham... mów wyraźnie po polsku. Kliknij 'Zatrzymaj', aby zakończyć.
        </div>
        <textarea id="opis" name="opis" rows="6" class="input-sm" required placeholder="{{ _('opisz_problem') }}"></textarea>

        <label for="bugPageScreenshots">Zrzuty ekranu / Zdjęcia (maksymalnie 3):</label>
        <input type="file" id="bugPageScreenshots" name="zalaczniki" accept="image/*" multiple class="input-sm">
        <div id="bugPageImagePreviews" class="d-flex gap-10 flex-wrap mt-5"></div>

        <div class="d-flex gap-10 mt-10">
            <button type="submit" class="btn-action btn-warning" id="submitBtn">{{ _('zglosz_btn') }}</button>
            <a href="/" class="btn-action btn-cancel">ANULUJ</a>
            <a href="/moje_zgloszenia_bledow" class="btn-action btn-outline">Moje zgłoszenia</a>
        </div>
    </form>
</div>

<script>
var _pageBugRecognition = null;
var _pageBugIsRecording = false;

function showPageMicPermissionHelp(isBlocked) {
    var statusMsg = document.getElementById('bugPageVoiceStatusMsg');
    if (!statusMsg) return;
    var isChrome = navigator.userAgent.indexOf('Chrome') !== -1;
    var isEdge = navigator.userAgent.indexOf('Edg') !== -1;
    var hint = '';
    if (isBlocked) {
        if (isChrome || isEdge) {
            hint = '<br><strong>Jak odblokować:</strong><br>' +
                '1. Kliknij ikonę 🔒 / 📷 po lewej stronie paska adresu przeglądarki<br>' +
                '2. Znajdź <strong>Mikrofon</strong> i zmień na <strong>Zezwalaj</strong><br>' +
                '3. Odśwież stronę i spróbuj ponownie';
        } else {
            hint = '<br>Kliknij ikonę zamkniętej kłódki w pasku adresu i zezwól na dostęp do mikrofonu, a następnie odśwież stronę.';
        }
    }
    statusMsg.style.display = 'block';
    statusMsg.style.background = '#fef2f2';
    statusMsg.style.borderColor = '#fecaca';
    statusMsg.style.color = '#b91c1c';
    statusMsg.innerHTML = '<strong>⛔ Mikrofon zablokowany!</strong><br>Przeglądarka nie ma uprawnień do mikrofonu.' + hint;
}

function stopPageVoiceDictation() {
    if (_pageBugRecognition) {
        try { _pageBugRecognition.stop(); } catch(e) {}
        _pageBugRecognition = null;
    }
    _pageBugIsRecording = false;
    var btn = document.getElementById('bugPageVoiceBtn');
    var btnText = document.getElementById('bugPageVoiceBtnText');
    if (btn) {
        btn.style.background = '#eff6ff';
        btn.style.borderColor = '#93c5fd';
        btn.style.color = '#1d4ed8';
    }
    if (btnText) btnText.textContent = 'Dyktuj głosem';
    // NIE ukrywamy statusMsg — może zawierać instrukcję błędu
}

function togglePageVoiceDictation() {
    var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) {
        var statusMsg = document.getElementById('bugPageVoiceStatusMsg');
        if (statusMsg) {
            statusMsg.style.display = 'block';
            statusMsg.style.background = '#fffbeb';
            statusMsg.style.borderColor = '#fcd34d';
            statusMsg.style.color = '#92400e';
            statusMsg.innerHTML = '⚠️ <strong>Dyktowanie niedostępne</strong> – Twoja przeglądarka nie obsługuje Web Speech API.<br>Użyj <strong>Chrome</strong> lub <strong>Edge</strong> i odśwież stronę.';
        }
        return;
    }

    if (_pageBugIsRecording) {
        stopPageVoiceDictation();
        return;
    }

    var textarea = document.getElementById('opis');
    if (!textarea) return;

    var btn = document.getElementById('bugPageVoiceBtn');
    var btnText = document.getElementById('bugPageVoiceBtnText');
    var statusMsg = document.getElementById('bugPageVoiceStatusMsg');

    try {
        _pageBugRecognition = new SpeechRec();
        _pageBugRecognition.lang = 'pl-PL';
        _pageBugRecognition.continuous = true;
        _pageBugRecognition.interimResults = true;

        var baseText = textarea.value ? textarea.value.trim() + ' ' : '';

        _pageBugRecognition.onstart = function() {
            _pageBugIsRecording = true;
            if (btn) {
                btn.style.background = '#fee2e2';
                btn.style.borderColor = '#ef4444';
                btn.style.color = '#b91c1c';
            }
            if (btnText) btnText.textContent = 'Zatrzymaj nagrywanie';
            if (statusMsg) {
                statusMsg.style.display = 'block';
                statusMsg.style.background = '#fef2f2';
                statusMsg.style.borderColor = '#fecaca';
                statusMsg.style.color = '#dc2626';
                statusMsg.innerHTML = '🎙️ Słucham... mów wyraźnie po polsku. Kliknij <strong>Zatrzymaj nagrywanie</strong>, aby zakończyć.';
            }
        };

        _pageBugRecognition.onresult = function(event) {
            var interimTranscript = '';
            var finalTranscript = '';
            for (var i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            if (finalTranscript) {
                baseText += finalTranscript + ' ';
            }
            textarea.value = (baseText + interimTranscript).trimStart();
            textarea.scrollTop = textarea.scrollHeight;
        };

        _pageBugRecognition.onerror = function(event) {
            console.warn('SpeechRecognition error:', event.error);
            stopPageVoiceDictation();
            if (event.error === 'not-allowed' || event.error === 'permission-denied') {
                showPageMicPermissionHelp(true);
            } else if (event.error === 'network') {
                var sm = document.getElementById('bugPageVoiceStatusMsg');
                if (sm) { sm.style.display = 'block'; sm.innerHTML = '⚠️ Brak połączenia – rozpoznawanie mowy wymaga dostępu do internetu.'; }
            } else if (event.error !== 'aborted') {
                var sm = document.getElementById('bugPageVoiceStatusMsg');
                if (sm) { sm.style.display = 'block'; sm.innerHTML = '⚠️ Błąd mikrofonu: ' + event.error + '. Spróbuj ponownie.'; }
            }
        };

        _pageBugRecognition.onend = function() {
            stopPageVoiceDictation();
        };

        _pageBugRecognition.start();
    } catch(err) {
        console.error('Failed to start SpeechRecognition:', err);
        stopPageVoiceDictation();
        showPageMicPermissionHelp(err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError');
    }
}
const pageFileInput = document.getElementById('bugPageScreenshots');
const pagePreviewBox = document.getElementById('bugPageImagePreviews');
if (pageFileInput) {
    pageFileInput.addEventListener('change', function(e) {
        if (pagePreviewBox) pagePreviewBox.innerHTML = '';
        if (this.files.length > 3) {
            alert('Możesz dodać maksymalnie 3 zdjęcia!');
            this.value = '';
            return;
        }
        Array.from(this.files).forEach(function(file) {
            if (!file.type.startsWith('image/')) return;
            var reader = new FileReader();
            reader.onload = function(evt) {
                if (pagePreviewBox) {
                    var img = document.createElement('img');
                    img.src = evt.target.result;
                    img.style.height = '80px';
                    img.style.width = '80px';
                    img.style.objectFit = 'cover';
                    img.style.borderRadius = '8px';
                    img.style.border = '1px solid #cbd5e1';
                    pagePreviewBox.appendChild(img);
                }
            };
            reader.readAsDataURL(file);
        });
    });
}

const _reportForm = document.getElementById('reportForm');
if (_reportForm) _reportForm.addEventListener('submit', async function(e) {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    const originalText = submitBtn.textContent;
    
    try {
        submitBtn.disabled = true;
        submitBtn.textContent = '⏳ Wysyłanie...';
        
        const formData = new FormData(this);
        formData.append('sciezka', window.location.pathname);
        const response = await fetch('/api/zglos_blad_systemu', {
            method: 'POST',
            body: formData
        });
        const resData = await response.json();
        
        if (response.ok && resData.success) {
            if (typeof showToast === 'function') showToast('✓ Zgłoszenie zapisano pomyślnie', 'success');
            else alert('✓ Zgłoszenie zapisano pomyślnie');
            this.reset();
            if (pagePreviewBox) pagePreviewBox.innerHTML = '';
            window.location.href = '/moje_zgloszenia_bledow';
        } else {
            const msg = (resData && resData.message) || response.statusText;
            if (typeof showToast === 'function') showToast('❌ Błąd: ' + msg, 'error');
            else alert('❌ Błąd: ' + msg);
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
        }
    } catch (error) {
        console.error('Error:', error);
        if (typeof showToast === 'function') showToast('❌ Błąd połączenia: ' + error.message, 'error');
        else alert('❌ Błąd połączenia: ' + error.message);
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
    }
});
</script>

{% endblock %}
